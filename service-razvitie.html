<style>

:root{
  --bg:#09090b;--bg2:#101014;--card:#141419;--line:#292930;--text:#f4f4f5;
  --muted:#9b9ba5;--accent:#b8ff4d;--accent2:#7c5cff;--white:#fff;
  --max:1180px;--radius:24px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
.container{width:min(var(--max),calc(100% - 40px));margin:auto}
.topline{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),transparent)}
header{position:fixed;z-index:20;top:3px;left:0;right:0;border-bottom:1px solid transparent;transition:.3s}
header.scrolled{background:rgba(9,9,11,.86);backdrop-filter:blur(18px);border-color:var(--line)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:-.08em;font-size:25px}.logo i{color:var(--accent);font-style:normal}
.navlinks{display:flex;gap:30px;align-items:center;font-size:14px;color:#c9c9cf}
.navlinks a:hover{color:#fff}
.cta-small{border:1px solid #45454d;padding:11px 16px;border-radius:999px;color:#fff}
.cta-small:hover{border-color:var(--accent);color:var(--accent)}
.burger{display:none;background:none;border:0;color:#fff;font-size:25px}
.hero{min-height:860px;padding:170px 0 90px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:650px;height:650px;right:-260px;top:100px;background:radial-gradient(circle,rgba(124,92,255,.25),transparent 65%);pointer-events:none}
.hero:after{content:"";position:absolute;width:500px;height:500px;left:-300px;bottom:-220px;background:radial-gradient(circle,rgba(184,255,77,.11),transparent 68%);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.15em;font-weight:800}
.eyebrow:before{content:"";width:28px;height:1px;background:var(--accent)}
h1{font-size:clamp(54px,8vw,104px);line-height:.92;letter-spacing:-.075em;max-width:1050px;margin:25px 0 32px}
h1 span{color:var(--accent)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:70px;align-items:end}
.lead{font-size:20px;line-height:1.55;color:#c3c3c9;max-width:690px}
.buttons{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:15px 21px;border-radius:12px;font-weight:750;border:1px solid var(--line)}
.btn-primary{background:var(--accent);color:#0a0a0b;border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-secondary:hover{border-color:#666}
.hero-card{border:1px solid var(--line);background:rgba(20,20,25,.72);border-radius:var(--radius);padding:26px;box-shadow:0 30px 100px rgba(0,0,0,.35)}
.terminal{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;color:#a8a8b0}
.terminal .ok{color:var(--accent)}.terminal .violet{color:#a99aff}
.term-row{padding:8px 0;border-bottom:1px solid #24242a}.term-row:last-child{border:0}
.marquee{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;color:#707079;font-size:12px;letter-spacing:.16em;font-weight:800}
.marquee-inner{display:flex;gap:34px;padding:18px 0;min-width:max-content}
.marquee b{color:#d8d8dc}
section{padding:115px 0}
.section-dark{background:#0d0d10}
.section-head{display:flex;justify-content:space-between;gap:50px;align-items:end;margin-bottom:55px}
.kicker{color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800}
h2{font-size:clamp(40px,5vw,66px);line-height:.98;letter-spacing:-.06em;margin:12px 0 0;max-width:760px}
.section-note{max-width:360px;color:var(--muted);font-size:15px}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.service{display:block;background:var(--card);padding:30px;min-height:245px;transition:.25s}
.service:hover{background:#19191f}
.num{font-family:monospace;color:#666;font-size:12px}
.service h3{font-size:23px;letter-spacing:-.035em;margin:48px 0 10px}
.service p{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.tag{border:1px solid #303038;border-radius:999px;padding:5px 9px;font-size:11px;color:#aaa}
.capabilities{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.cap{border:1px solid var(--line);border-radius:20px;padding:27px;background:#0f0f13}
.cap strong{display:block;font-size:18px;margin-bottom:9px}.cap p{margin:0;color:var(--muted);font-size:14px}
.workflow{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.step{padding:30px 25px 35px;border-right:1px solid var(--line);min-height:260px}.step:last-child{border:0}
.stepnum{font:12px monospace;color:var(--accent)}
.step h3{font-size:22px;margin:45px 0 10px}.step p{color:var(--muted);font-size:14px;margin:0}
.agency{background:#f1f1ee;color:#101012}
.agency .kicker{color:#666}.agency h2{color:#111}
.agency-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.agency-list{list-style:none;padding:0;margin:0}
.agency-list li{padding:18px 0;border-bottom:1px solid #d3d3ce;font-size:18px;display:flex;gap:15px}
.agency-list li:before{content:"↗";font-weight:800}
.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.case{display:block;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--card);transition:.25s}
.case:hover{border-color:#3a3a42}
.case-visual{height:290px;background:linear-gradient(135deg,#17171d,#282830);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;letter-spacing:-.06em;color:#555}
.case-body{padding:25px}.case-type{color:var(--accent);font:11px monospace;text-transform:uppercase;letter-spacing:.12em}.case h3{font-size:30px;margin:9px 0}.case p{color:var(--muted);margin:0}
.cta{padding:125px 0;background:linear-gradient(135deg,#171719,#0b0b0e);position:relative;overflow:hidden}
.cta h2{max-width:850px}.cta p{color:var(--muted);font-size:18px;max-width:620px}
.contact{background:#0d0d10}
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:80px}
.contact-info{color:var(--muted);max-width:430px}
.contact-links{margin-top:35px;display:grid;gap:14px}.contact-links a{font-size:19px}.contact-links a:hover{color:var(--accent)}
form{border:1px solid var(--line);border-radius:24px;padding:30px;background:#111116}
label{display:block;color:#aaa;font-size:12px;margin-bottom:7px}
input,textarea{width:100%;border:1px solid #303038;background:#0b0b0f;color:#fff;border-radius:11px;padding:14px 15px;outline:none;margin-bottom:18px}
input:focus,textarea:focus{border-color:#666}
textarea{min-height:130px;resize:vertical}
.consent{display:flex;gap:9px;align-items:flex-start;color:#777;font-size:11px;margin-bottom:18px}.consent input{width:auto;margin:2px 0}
footer{border-top:1px solid var(--line);padding:25px 0;color:#666;font-size:12px}
.footer{display:flex;justify-content:space-between;gap:20px}.footer a:hover{color:#fff}
@media(max-width:850px){
 .container{width:min(var(--max),calc(100% - 28px))}
 .navlinks{display:none}.burger{display:block}
 .hero{min-height:auto;padding:140px 0 70px}.hero-grid{grid-template-columns:1fr;gap:40px}
 h1{font-size:clamp(51px,15vw,82px)}
 .services{grid-template-columns:1fr}.service{min-height:190px}.service h3{margin-top:28px}
 .section-head,.agency-grid,.contact-grid{grid-template-columns:1fr;display:grid;gap:20px}
 .capabilities,.case-grid{grid-template-columns:1fr}
 .workflow{grid-template-columns:1fr}.step{border-right:0;border-bottom:1px solid var(--line);min-height:0}
 .agency{padding:85px 0}.section-note{max-width:none}
}

.page-hero{min-height:auto;padding:170px 0 40px;position:relative;overflow:hidden}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700}
.back:hover{color:var(--accent)}
.page-hero h1{font-size:clamp(36px,6vw,62px);letter-spacing:-.05em;margin:20px 0 18px;max-width:820px}
.page-hero .lead{font-size:18px}
.case-shot{margin-top:44px;border-radius:24px 24px 0 0;overflow:hidden;border:1px solid var(--line);border-bottom:none}
.case-shot img{display:block;width:100%;height:auto}
.detail-grid{display:grid;grid-template-columns:1.3fr .8fr;gap:60px;align-items:start}
.detail-grid p{color:#c3c3c9;font-size:16px;line-height:1.75;margin:0 0 16px}
.meta-list{display:grid;gap:14px}
.link-ext{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:700;margin-top:8px}
.link-ext:hover{opacity:.8
